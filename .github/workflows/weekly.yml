# Sunday night: the committee rosters, the members who have left, and the
# study committees' members and bills -- the things the build reads that the
# day's files do not carry. The same shape as the nightly (nightly.yml), in the
# same concurrency group, so the two never run at once; it runs four hours
# before Monday's night, which builds and publishes what it took. nightly.py's
# weekly() says what each fetch is and how it is kept whole. It publishes
# nothing and holds no Pages token.
#
# THE SCHEDULE IS ON, since its first run by hand, on 30 September 2026, came
# back clean. To pause it, Actions -> weekly -> "..." -> Disable workflow;
# keepalive never re-enables a workflow the person switched off. To take it
# out, put the "# " back in front of the two schedule lines under "on:" and
# push to main. 04:17 UTC on Monday is 12:17 a.m. Eastern in summer (EDT) and
# 11:17 p.m. on Sunday in winter (EST); refusal.NIGHT_WINDOWS keeps the
# laptop's fetches clear of it from 04:00 to 06:30 UTC.
#
# A run of any branch but main ("Use workflow from") is a dry run (7 October
# 2026; DRY_RUN, below), and its title says so: it proves the weekly's code
# and keeps nothing it fetched.

name: weekly
run-name: >-
  weekly ${{ github.event_name == 'schedule' && '(scheduled)'
  || (github.ref != 'refs/heads/main'
  && (inputs.new_term && '(dry run: not main, new term: refused)'
  || (inputs.fetch && '(dry run: not main, fetching)' || '(dry run: not main, no fetch)')))
  || (inputs.fetch && (inputs.new_term && '(by hand, fetching, new term)' || '(by hand, fetching)')
  || (inputs.new_term && '(by hand, new term without the fetch: refused)' || '(by hand, no fetch)')) }}

on:
  workflow_dispatch:
    inputs:
      fetch:
        description: "Take the rosters and study committees from the General Court"
        type: boolean
        default: false
      # NEW TERM (30 September 2026): the week a term's committee assignments
      # are cleared and made again, in January. For this run only -- nightly.py
      # --runner --weekly --new-term -- the committee rosters, the committee
      # list and the study committees' views are taken however much smaller,
      # though never empty; the members who have left are a merge and keep
      # their guard. Ticked without the fetch it stops, and its page says to
      # tick both. A scheduled week never carries it. This job publishes
      # nothing, so nothing here waits for a deploy as the nightly's New term
      # run does: what it takes reaches the site with the next night's build.
      new_term:
        description: "New term: accept the General Court's smaller files once"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  FETCH: ${{ github.event_name == 'schedule' || inputs.fetch }}
  # A RUN OFF MAIN IS A DRY RUN (7 October 2026, the person's decision). This
  # job has no Dry run box, and a run of it by hand on dev sent every list it
  # took back to the kit (kit-up) and its verdict to state/last-weekly.json
  # (state-up), and main's next night built from them -- dev's code reaching
  # production a night later. Under this word, which every step inherits and
  # nightly.py and cloud.py read themselves (and the ref besides, so an edit
  # here cannot reopen it), the run fetches and checks as any week, and keeps
  # nothing it fetched: its verdict goes to archive/last-dry-weekly.json, and
  # kit-up and state-up send back only its logs, under logs/<day>/dry-run/,
  # that verdict, and a refusal or a hold on the SQL host, which hold every
  # lane whichever branch met them. A dev weekly is for proving code.
  # A scheduled week is always main's. preflight holds this line.
  DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
  # Only ever from the box, on a run by hand: never on a scheduled week.
  NEW_TERM: ${{ github.event_name == 'workflow_dispatch' && inputs.new_term }}

defaults:
  run:
    shell: pwsh

jobs:
  weekly:
    name: Sunday's fetches
    runs-on: windows-2022
    timeout-minutes: 120
    concurrency:
      group: gc-night
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set the clock to New Hampshire's
        run: |
          tzutil /s "Eastern Standard Time"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Date -Format "yyyy-MM-dd HH:mm zzz"

      - name: Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Node 24, for preflight
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      # boto3 is cloud.py's, for R2: any version from 1.36 fits the checksum
      # setting it makes, and this one is pinned so a night does not take
      # whatever is newest.
      - name: The Python packages, at the laptop's versions, and boto3 for R2
        run: |
          python -m pip install --disable-pip-version-check --no-input `
            numpy==2.5.2 openpyxl==3.1.5 et-xmlfile==2.0.0 pdfplumber==0.11.10 `
            pdfminer.six==20260107 pypdfium2==5.13.0 pillow==12.3.0 `
            charset-normalizer==3.5.1 cryptography==50.0.1 cffi==2.1.1 pycparser==3.0 `
            PyYAML==6.0.3 boto3==1.43.103
          exit $LASTEXITCODE

      - name: Bring the state files down from R2 (the refusal record, last night's census)
        id: statedown
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py state-down
          exit $LASTEXITCODE

      - name: Bring the kit down from R2
        id: kitdown
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py kit-down
          exit $LASTEXITCODE

      - name: Sunday's fetches
        id: weekly
        run: |
          $flags = @('--runner', '--weekly')
          if ($env:FETCH -ne 'true') { $flags += '--no-fetch' }
          if ($env:DRY_RUN -eq 'true') { $flags += '--dry-run' }
          if ($env:NEW_TERM -eq 'true') { $flags += '--new-term' }
          python nightly.py @flags
          exit $LASTEXITCODE

      - name: A refusal goes to R2 at once
        if: always() && steps.statedown.outcome == 'success' && hashFiles('archive/refused.json') != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          Write-Output "A refusal is on file in archive/refused.json. It goes to R2's state/ now."
          python cloud.py state-up
          exit $LASTEXITCODE

      # On a dry run (DRY_RUN, above, which cloud.py reads itself) none of the
      # lists it took goes back: only its logs, under logs/<day>/dry-run/,
      # where pull does not take them for the week's (cloud.py --dry-night).
      - name: Send what changed, and the logs, back to R2
        id: kitup
        if: always() && steps.kitdown.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py kit-up
          exit $LASTEXITCODE

      - name: The weekly verdict
        if: always()
        run: |
          python nightly.py --runner --weekly --close `
            --outcome "state-down=${{ steps.statedown.outcome }}" `
            --outcome "kit-down=${{ steps.kitdown.outcome }}" `
            --outcome "weekly=${{ steps.weekly.outcome }}" `
            --outcome "kit-up=${{ steps.kitup.outcome }}"
          exit $LASTEXITCODE

      - name: Send the state files back to R2
        if: always() && steps.statedown.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py state-up
          exit $LASTEXITCODE

      # Healthchecks' check expects the nightly each day, so the weekly job
      # tells it only when it fails; a success here would stand in for a
      # night that never ran. A dry run -- every run off main -- tells it
      # nothing at all (7 October 2026): its failure is the code it is
      # proving, not the week's, and the check watches only the runs whose
      # outcome is the site's -- the scheduled night, a real run by hand of
      # main, and a real week's failure. preflight holds this step.
      - name: Tell Healthchecks the weekly job failed
        if: failure() && env.DRY_RUN == 'false'
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if (-not $env:HC_URL) {
            Write-Output "No HEALTHCHECKS_URL secret, so no ping."
            exit 0
          }
          curl.exe -fsS -m 15 --retry 3 -o NUL "$env:HC_URL/fail"
          exit 0

  # The 60-day pause, as in nightly.yml: this workflow re-enables itself each
  # Sunday it runs, and only itself.
  keepalive:
    name: keep the schedule alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api --method PUT "repos/$REPO/actions/workflows/weekly.yml/enable" > /dev/null; then
            echo "weekly.yml re-enabled"
          else
            echo "weekly.yml could not be re-enabled"
            exit 1
          fi
