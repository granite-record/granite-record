# The nightly, on GitHub's machines: take the day's data from the General
# Court, rebuild the whole site, check it, and publish only what passes.
# reports/cloud/CLOUD_MOVE.md on the laptop is the plan this follows, and
# nightly.py's docstring says what --runner changes. preflight.py holds this
# file to its rules: only the secrets listed there, never echoed; the least
# permission each job needs; production only behind its environment.
#
# THE SCHEDULE IS ON, since 26 September 2026, after three supervised dry
# runs (the third fetched, and was clean and publishable) and the laptop's
# stand-down. To pause it, Actions -> nightly -> "..." -> Disable workflow;
# keepalive never re-enables a workflow the person switched off. To take it
# out, put the "# " back in front of the two schedule lines under "on:" and
# push to main. GitHub reads cron as UTC and has no time zone: 08:17 UTC is
# 4:17 a.m. Eastern in summer (EDT) and 3:17 a.m. in winter (EST). The :17
# keeps away from the top of the hour, when scheduled runs start late or are
# dropped. It was 06:17 until 27 September 2026, when the first scheduled
# night, at 2:17 a.m. EDT, got all 13 files under dynamicdatadump/ as 3 bytes
# (an empty file's byte-order mark), and the move to 08:17 was made on the
# guess that the General Court rewrites them around 2 a.m. The next night, at
# 4:42 a.m. EDT, got eight of them empty, so no hour is safe on the evidence:
# the files are sometimes half written in the early morning. From 28 September
# the night asked again instead -- every 30 minutes, up to six tries
# (nightly.EMPTY_TRIES). Since 2 October 2026 a scheduled night does not:
# an export that comes back empty sends it to the General Court's database
# at once (nightly.DB_AFTER_TRIES; the person's decision, because asking
# again half an hour later tended not to bring the files), and only when
# the database cannot be used is the export asked once more, half an hour
# later (nightly.TRIES_AFTER_DB). The six tries are now only a New term
# run's, started by hand, which never asks the database: it is the longest
# run there is, and is why the night's job still allows 300 minutes.
# refusal.NIGHT_WINDOWS, which keeps the laptop's fetches clear of the
# night, moves with the cron line.
#
# By hand: the Actions tab, "nightly", "Run workflow". A run by hand of main
# does what its four boxes say; a scheduled night fetches, deploys a preview,
# and publishes on its own when the gate clears, or asks for approval when it
# holds (REVIEW_GATE, below). A run of any other branch ("Use workflow
# from") is a dry run whatever its boxes say, and its title says so -- "(dry
# run: not main)" where the box was unticked (the person's decision of 7
# October 2026; DRY_RUN, below). The fourth box, New term, is for the one
# night a term turns over, and the note above it says what it lets through,
# and that nothing it lets through is kept until its build is published.

name: nightly
run-name: >-
  nightly ${{ github.event_name == 'schedule' && '(scheduled)'
  || (inputs.timer && !inputs.dry_run && github.ref == 'refs/heads/main' && '(scheduled, by the timer)')
  || (inputs.new_term && (github.ref != 'refs/heads/main'
  && '(by hand, new term: refused, not main)'
  || ((inputs.dry_run || !inputs.fetch)
  && '(by hand, new term: refused, its page says which boxes)' || '(by hand, new term)'))
  || (inputs.dry_run && '(dry run)'
  || (github.ref != 'refs/heads/main' && '(dry run: not main)' || '(by hand, may publish)'))) }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check; nothing goes to production"
        type: boolean
        default: true
      fetch:
        description: "Take the day's data from the General Court (website and database)"
        type: boolean
        default: false
      preview:
        description: "Deploy the build to a preview address: nightly.graniterecord.pages.dev, or a dry run's to dry-run.graniterecord.pages.dev (needs the Pages token)"
        type: boolean
        default: true
      # NEW TERM (30 September 2026): the night the General Court's files first
      # show a new term, when they really do get much smaller. For this run
      # only -- nightly.py --new-term -- the smaller files are installed
      # (snapshot_gencourt.py --allow-shrink), the census gates let a fall
      # through, and the feed prune is allowed. A scheduled night never carries
      # it. nightly.py refuses it with Dry run ticked, or with "Take the day's
      # data" unticked, and says so on the run's page: this is the run that
      # takes the new files and may publish the switch. The preview shows the
      # switched site before anyone approves it.
      #
      # A NEW TERM IS SEEN BY ITS YEARS (5 October 2026). A scheduled night
      # refuses files naming a newer term than the installed ones whatever
      # their size; this run takes them (--allow-turn), and only once the
      # term it leaves is frozen as installed (src/lib/freeze_term.py --session, sent
      # with seed-kit): otherwise it stops before asking anything. The census
      # lets only the feeds fall on it, and a finished term that lost bills
      # stops it as it stops any night. The
      # switch is the first night the files show the new term, Organization
      # Day's resolutions included, and a file that turns later goes in on an
      # ordinary night over its frozen copy.
      #
      # NOTHING IT ACCEPTS IS KEPT UNTIL ITS BUILD IS PUBLISHED (1 October
      # 2026). The night job of this run sends none of what it took back to the
      # kit (cloud.py kit-up --hold: it waits under nights/<run>/kit/) and
      # writes no census. The publish job, once its deploy has landed, moves
      # the files into the kit (cloud.py kit-release) and sends the new counts
      # up. Rejected, left waiting until the next scheduled night, or kept out
      # by another blocker, the run leaves the kit and the census as they were,
      # and the next night refuses the smaller files again and says why.
      #
      # THIS RUN MUST KEEP A REQUIRED REVIEWER. The person decided on 30
      # September 2026 that the switch to a new term waits for their approval
      # even after the approvals of ordinary nights are switched off. Today the
      # "production" environment has them as its required reviewer for every
      # deploy, which covers this run. Before that rule comes off, a New term
      # run's publish job must go through an environment that still has one.
      # preflight fails if this box is here without this note.
      new_term:
        description: "New term: accept the General Court's smaller files once"
        type: boolean
        default: false
      # THE NIGHT'S TIMER (23 October 2026, workers/night-timer/): the Worker
      # that starts the night at 08:17 UTC ticks this, with the scheduled
      # night's other boxes, because GitHub's own cron had begun starting it
      # hours late. It names the run and nothing else: what the run does is
      # the boxes'. GitHub's cron below stays as the fallback, and stands
      # down when this has started tonight's night (job "started").
      timer:
        description: "Started by the night's timer (workers/night-timer), not by hand"
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"

# The workflow's own token reads the repository and nothing else. The one job
# that needs more, keepalive, asks for it itself.
permissions:
  contents: read

# ONE DRY RUN AT A TIME, IN LINE BEHIND THE NIGHT (7 October 2026). The
# night's job waits in gc-night with every night and weekly job, and GitHub
# keeps one waiting run per group: a newer one cancels the one already
# waiting. So a dry run started while another held gc-night cancelled a
# scheduled night waiting behind it. Every dry run -- by the box or by the
# branch -- waits here first, one at a time, so that no more than one is
# ever in gc-night or waiting for it, and a newer dry run replaces only a dry
# run waiting here; a run that is not a dry run has a group of its own, its
# run's id, and never waits here. Still open: a dry run started while a real
# run of main holds gc-night and the scheduled night waits behind it cancels
# that night, which the dead-man's switch then reports. preflight holds this
# line beside DRY_RUN. The box is ticked only when it is true or "true" (THE
# TIMER'S BOXES ARE STRINGS: "false" is a string, and a string is truthy, so
# the timer's first real night waited here, in line with the dry runs).
concurrency:
  group: ${{ (github.ref != 'refs/heads/main' || (github.event_name != 'schedule' && (inputs.dry_run == true || inputs.dry_run == 'true'))) && 'dry-runs' || github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  WRANGLER_SEND_METRICS: "false"
  # A scheduled night fetches, previews, and may publish once approved. A run
  # by hand does what its boxes say.
  FETCH: ${{ github.event_name == 'schedule' || inputs.fetch }}
  # A DRY RUN IS KEPT APART (7 October 2026; nightly.py's docstring says why).
  # Every step inherits this, and nightly.py and cloud.py read it themselves:
  # under it the verdict goes to archive/last-dry-run.json and never to the
  # night's, the census is left alone, kit-up and state-up send back only what
  # the run fetched, and nothing goes to production -- whether or not a step
  # passes --dry-run. So a dry run on dev, started while a night waits for
  # approval, leaves that night approvable. preflight holds this line.
  # EVERY RUN OFF MAIN IS ONE (7 October 2026, the person's decision), Dry run
  # ticked or not: a run by hand on dev with the box unticked counted as a
  # real night, wrote the census, the night's verdict and the kit, so dev's
  # code reached main's next night through the bucket, and it could make a
  # waiting night unapprovable. nightly.py and cloud.py read the ref too
  # (GITHUB_REF), so an edit to this line does not reopen that. A scheduled
  # night is always main's, and it and a run by hand of main are as before.
  # The branch first, and the box ticked only when it is true or "true": a
  # run through GitHub's API -- the timer's -- carries "false", a string, and
  # `"false" || <a branch other than main>` was "false" (25 October 2026).
  DRY_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'schedule' && (inputs.dry_run == true || inputs.dry_run == 'true')) }}
  PREVIEW: ${{ github.event_name == 'schedule' || inputs.preview }}
  # Only ever from the box, on a run by hand: never on a scheduled night.
  NEW_TERM: ${{ github.event_name == 'workflow_dispatch' && inputs.new_term }}
  # THE GATE (6 October 2026; nightly.py says what it is). "shadow": every
  # night still waits for approval in "production", and the run's page says
  # what the gate would have done. "on" goes with the publish job's
  # environment line choosing "production-review" for a night the gate holds
  # and for every New term run, and "production", with no reviewer, for the
  # rest; preflight holds the two together.
  REVIEW_GATE: "on"

defaults:
  run:
    shell: pwsh

jobs:
  # HAS THE TIMER STARTED TONIGHT'S NIGHT (23 October 2026)? Asked only by a
  # scheduled run, which since workers/night-timer/ is the fallback: GitHub
  # started it five to seven hours late from 19 October. A run of this
  # workflow on main that the timer started today ("(scheduled, by the
  # timer)") means tonight's night is that one, and this one stands down
  # before it pings Healthchecks or asks anything of anyone. A list that
  # cannot be read stands nothing down: two nights one after the other is
  # better than none.
  started:
    name: has the timer started tonight's night
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      by_timer: ${{ steps.look.outputs.by_timer }}
    steps:
      - name: Look for tonight's run by the timer
        id: look
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          day=$(date -u +%F)
          n=$(gh api -X GET "repos/$REPO/actions/workflows/nightly.yml/runs" \
                -f branch=main -f event=workflow_dispatch -f created=">=$day" -f per_page=30 \
                --jq '[.workflow_runs[] | select(.display_title | contains("(scheduled, by the timer)"))] | length') || n=0
          echo "by_timer=${n:-0}" >> "$GITHUB_OUTPUT"
          if [ "${n:-0}" != "0" ]; then
            echo "the timer started tonight's night; this scheduled run stands down"
          else
            echo "no run by the timer today; this scheduled run is tonight's night"
          fi

  night:
    name: the night
    needs: started
    # Every run but a scheduled one the timer has already answered for. The
    # status function keeps a run by hand going when "started" is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.started.outputs.by_timer == '0') }}
    runs-on: windows-2022
    timeout-minutes: 300
    # The preview's Pages token can live in this environment rather than in the
    # repository's secrets; see the operator checklist. A DRY RUN'S PREVIEW IS
    # ITS OWN (7 October 2026; nightly.DRY_PREVIEW_BRANCH): the night's address
    # is where a night waiting for approval is looked at, and a dry run -- every
    # run of dev -- deployed its build over it. The url names the address this
    # run deployed to; preflight holds the two together.
    environment:
      name: preview
      url: ${{ env.DRY_RUN == 'true' && 'https://dry-run.graniterecord.pages.dev' || 'https://nightly.graniterecord.pages.dev' }}
    # One night at a time, and never beside the weekly job: a second start
    # waits for the first rather than running beside it.
    concurrency:
      group: gc-night
      cancel-in-progress: false
    outputs:
      built: ${{ steps.night.outputs.built }}
      publishable: ${{ steps.night.outputs.publishable }}
      # The run's own DRY_RUN, for the publish job, whose if cannot read env
      # (THE TIMER'S BOXES ARE STRINGS, at the publish job).
      dry_run: ${{ env.DRY_RUN }}
      # THE GATE (6 October 2026; nightly.py says what it is): "false" when the
      # night would publish without approval, "true" when it would wait for
      # it. In shadow nothing reads it yet: every night still waits in
      # "production". The routing that reads it is a person's change to make.
      review: ${{ steps.night.outputs.review }}
    steps:
      # HEALTHCHECKS HEARS ONLY FROM A REAL RUN (7 October 2026). Its check is
      # the dead-man's switch for a night that never ran: a scheduled night,
      # or a run by hand of main that is not a dry run, pings it. A dry run --
      # by the box, or by its branch -- pings nothing, at the start or the
      # end: its success on a day the scheduled night failed to start would
      # stand in for that night and hide it. preflight holds both steps.
      - name: Tell Healthchecks the night has started
        if: env.DRY_RUN == 'false'
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          # Main is refs/heads/main exactly (nightly.MAIN_REF): GitHub's if
          # above compares without case, and takes a branch named Main for main.
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            Write-Output "A run of $env:GITHUB_REF, not refs/heads/main, is a dry run: no ping."
            exit 0
          }
          if (-not $env:HC_URL) {
            Write-Output "No HEALTHCHECKS_URL secret, so no ping."
            exit 0
          }
          curl.exe -fsS -m 15 --retry 3 -o NUL "$env:HC_URL/start"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "Healthchecks did not answer. The night goes on without it."
          }
          exit 0

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set the clock to New Hampshire's
        run: |
          tzutil /s "Eastern Standard Time"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Date -Format "yyyy-MM-dd HH:mm zzz"

      - name: Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      # boto3 is cloud.py's, for R2: any version from 1.36 fits the checksum
      # setting it makes, and this one is pinned so a night does not take
      # whatever is newest. yt-dlp is the livestream step's, for captions, at
      # the laptop's version; without it that step exits 3, "not set up".
      # yt-dlp-ejs is yt-dlp's solver for YouTube's challenges, run with the
      # Node set up above (livestreams.py asks with --js-runtimes node), at
      # the version yt-dlp 2026.8.19 names in its own metadata; preflight
      # holds the two together (10 October 2026: the free fix tried first).
      # curl_cffi lets yt-dlp ask for a caption file as a browser would: YouTube
      # is thought to read the connection's fingerprint, and without it every
      # ask logged "no impersonate target is available" (18 October 2026, at
      # the person's word, on the laptop first). 0.16.0 is the version yt-dlp
      # 2026.8.19's own pin-curl-cffi extra names; certifi is its need, at
      # the laptop's version.
      - name: The Python packages, at the laptop's versions, with boto3 and yt-dlp
        run: |
          python -m pip install --disable-pip-version-check --no-input `
            -r requirements.txt `
            yt-dlp==2026.8.19 yt-dlp-ejs==0.8.0 curl_cffi==0.16.0 certifi==2026.7.22
          exit $LASTEXITCODE

      - name: Bring the state files down from R2 (the refusal record, last night's census)
        id: statedown
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python src/ops/cloud.py state-down
          exit $LASTEXITCODE

      - name: Bring the kit down from R2
        id: kitdown
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python src/ops/cloud.py kit-down
          exit $LASTEXITCODE

      # THE CAPTIONS INBOX (17 October 2026). YouTube refuses this machine with
      # its bot check and answers the laptop, so the laptop asks for what the
      # night's state says waits (livestreams.py --to-inbox, from Task
      # Scheduler) and puts each caption file in the bucket's inbox. This
      # brings every entry down, whatever its bytes, and writes nothing in the
      # bucket; the livestream step judges each one itself. It brings the
      # laptop's newest run record too (18 October 2026), which the verdict
      # reads for the laptop's refusal and its hold (nightly.LAPTOP_RUN). A
      # failure here leaves the step without an inbox, which it says, and
      # the night goes on: continue-on-error, or an R2 hiccup here would skip
      # the night itself; the verdict then warns that no record came down.
      # Its own short limit, since a hung transfer must not eat the night.
      - name: Bring the captions inbox down from R2
        id: inboxdown
        if: env.FETCH == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python src/ops/cloud.py inbox-down
          exit $LASTEXITCODE

      # YouTube, not the General Court. Before the build, which reads what it
      # adds; its --markers step runs inside build_all, after the step
      # --no-captions skips, and keeps what it reads in the kit's
      # candidate_segments.json and caption_spans.json, the night's files since
      # 10 October 2026, behind the timestamp probe's guard. The laptop takes
      # part only through the inbox (above): --inbox takes a waiting
      # recording's captions from it, and those are read under the same guard
      # as captions this step fetched. Exit 0 is success, including "nothing
      # new" and "captions deferred": YouTube refusing this machine is
      # recorded and held (livestreams.py, A REFUSAL), never asked again in
      # the same run, and the recordings keep the schedule's approximate
      # start; the verdict says how many wait and why. Any other exit -- 3 is
      # "not set up": no key, a refused key, or no yt-dlp -- fails the night,
      # loudly, at --close, without stopping the day's General Court files
      # from being taken and built: those cannot be taken later. Its own time
      # limit, so a hang inside one yt-dlp call can never eat the night: the
      # step's sixty minutes of asking (livestreams.BUDGET), the last ask's
      # fourteen past it (LAST_ASK_MINUTES), and the listing; preflight holds
      # the sum, and the night window after it. A step killed at the limit
      # leaves its lock, which goes stale in five minutes, long before the
      # build's --markers step. On the New term run, which every step knows
      # by NEW_TERM, it lists and asks YouTube for nothing.
      - name: New livestreams, from YouTube
        id: livestreams
        if: env.FETCH == 'true'
        continue-on-error: true
        timeout-minutes: 80
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if (-not (Test-Path src/ops/livestreams.py)) {
            Write-Output "src/ops/livestreams.py is not in this commit yet, so this step does nothing."
            exit 0
          }
          python src/ops/livestreams.py --since-state --inbox archive/captions-inbox
          $rc = $LASTEXITCODE
          if ($rc -eq 3) {
            Write-Output "livestreams.py exit 3: not set up. The night goes on, and fails at its end."
          }
          exit $rc

      # A NIGHT THE EXPORT FAILS (1 October 2026). When the General Court's
      # daily files come back empty, the night asks the SQL host the General
      # Court publishes credentials for instead (fetch_day_db.py, then
      # dayfiles_from_db.py) and installs all seven changing files or none --
      # since 2 October at once, after the export's first try, and no longer
      # after its sixth; nightly.py's docstring says when it may, and when
      # the export is asked once more afterwards. It needs nothing new
      # from this workflow, and NO SECRET: the credentials are the published
      # ones in probe_db.py; PowerShell, which reaches that host, is on this
      # image, as the study committees' views already use it; the hold on
      # that host (archive/sql-held.json) comes down and goes back with the
      # state files; and the copy kept under nh-archive/from-db/ goes back
      # with the kit. A scheduled night waits half an hour at most, and
      # only when the database cannot be used and the export is asked a
      # second time. The longest run is a New term run by hand: its six
      # tries are two and a half hours of the job's five, and the build is
      # under thirty minutes.
      - name: The night
        id: night
        run: |
          $flags = @('--runner')
          if ($env:FETCH -ne 'true') { $flags += '--no-fetch' }
          if ($env:DRY_RUN -eq 'true') { $flags += '--dry-run' }
          if ($env:NEW_TERM -eq 'true') { $flags += '--new-term' }
          python nightly.py @flags
          exit $LASTEXITCODE

      # A refusal is a fact about the address, and the laptop has to know at
      # once, not when the rest of the night has finished.
      - name: A refusal goes to R2 at once
        if: always() && steps.statedown.outcome == 'success' && hashFiles('archive/refused.json') != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          Write-Output "A refusal is on file in archive/refused.json. It goes to R2's state/ now."
          python src/ops/cloud.py state-up
          exit $LASTEXITCODE

      # A dry run's to its own address, dry-run.graniterecord.pages.dev, and
      # never to the night's, which a night waiting for approval is approved
      # from (nightly.py reads the dry run itself).
      - name: Deploy to the preview address
        id: preview
        if: always() && steps.night.outputs.built == 'true' && env.PREVIEW == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python nightly.py --runner --deploy-to preview
          exit $LASTEXITCODE

      # The publish job runs on another machine and needs this night's site.
      # Not as a GitHub artifact: a public repository's artifacts can be
      # downloaded by anyone signed in to GitHub, and the built site carries
      # the licensed logo. It goes to the private bucket as one archive,
      # nights/<run>/site.tar.gz, which the bucket's lifecycle rule deletes
      # after three days; its night's own verdict goes with it, in site.json,
      # and is what the publish job deploys it by.
      - name: Send the site to the private bucket for the publish job
        id: pack
        if: success() && steps.night.outputs.publishable == 'true' && env.DRY_RUN == 'false'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python src/ops/cloud.py site-up --run $env:RUN_ID
          exit $LASTEXITCODE

      # On a New term run what the night changed is HELD: it waits under
      # nights/<run>/kit/ and kit/ keeps the copies it had, so that the next
      # night still meets the smaller files and refuses them until this run's
      # build is published. The logs, the day's archive copy and the state go
      # up as on any night. On a dry run (DRY_RUN, above, which cloud.py reads
      # itself) only what the run fetched goes back -- the archive's copy of
      # each file the export served tonight, read against its name -- with its
      # logs under logs/<day>/dry-run/, a refusal or a hold, and its own
      # verdict: nothing its branch's code made or chose, not even the day's
      # files it installed or the archive's index, which main's next night
      # would build from (cloud.py's docstring, --dry-night). Both state-up
      # steps likewise.
      - name: Send what changed, and the logs, back to R2
        id: kitup
        if: always() && steps.kitdown.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $hold = @()
          if ($env:NEW_TERM -eq 'true') { $hold = @('--hold', $env:RUN_ID) }
          python src/ops/cloud.py kit-up @hold
          exit $LASTEXITCODE

      - name: The night's verdict
        if: always()
        run: |
          python nightly.py --runner --close `
            --outcome "state-down=${{ steps.statedown.outcome }}" `
            --outcome "kit-down=${{ steps.kitdown.outcome }}" `
            --outcome "livestreams=${{ steps.livestreams.outcome }}" `
            --outcome "night=${{ steps.night.outcome }}" `
            --outcome "preview=${{ steps.preview.outcome }}" `
            --outcome "pack=${{ steps.pack.outcome }}" `
            --outcome "kit-up=${{ steps.kitup.outcome }}"
          exit $LASTEXITCODE

      - name: Send the state files back to R2
        if: always() && steps.statedown.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python src/ops/cloud.py state-up
          exit $LASTEXITCODE

      # The captions inbox is cleared of what the state just sent no longer
      # waits for, read from the bucket's copy of that state, so a night whose
      # state did not go back clears nothing (cloud.py, THE CAPTIONS INBOX).
      # Never on a dry run, whose takings went into a state that stays here:
      # the next real night must find the entries. cloud.py refuses on a dry
      # night itself too. Only after a kit-up that succeeded: the state can say
      # a recording was read while the readings in candidate_segments.json
      # never went back, and clearing its entry then would lose the captions
      # the next night needs to read it again.
      - name: Clear what the night took from the captions inbox
        if: always() && steps.inboxdown.outcome == 'success' && steps.kitup.outcome == 'success' && env.DRY_RUN == 'false'
        continue-on-error: true
        timeout-minutes: 10
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python src/ops/cloud.py inbox-clear
          exit $LASTEXITCODE

      # Never for a dry run (the note above the first step).
      - name: Tell Healthchecks how the night ended
        if: always() && env.DRY_RUN == 'false'
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL }}
          HC_WARN_URL: ${{ secrets.HEALTHCHECKS_WARN_URL }}
          ENDED: ${{ job.status }}
        run: |
          # Main is refs/heads/main exactly (nightly.MAIN_REF): GitHub's if
          # above compares without case, and takes a branch named Main for main.
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            Write-Output "A run of $env:GITHUB_REF, not refs/heads/main, is a dry run: no ping."
            exit 0
          }
          if (-not $env:HC_URL) {
            Write-Output "No HEALTHCHECKS_URL secret, so no ping."
            exit 0
          }
          # An alert (nightly.py's ALERT_FILE: a refusal on file, a hold on
          # the database, a failed check of the built site, a night not clean) is a
          # /fail whatever the job did, with the alert as the ping's body,
          # which Healthchecks emails.
          $alert = 'logs/alert.txt'
          $said = (Test-Path $alert) -and ((Get-Item $alert).Length -gt 0)
          $end = if ($env:ENDED -eq 'success' -and -not $said) { '' } else { '/fail' }
          if ($said) {
            curl.exe -fsS -m 15 --retry 3 -o NUL --data-binary "@$alert" "$env:HC_URL$end"
          } else {
            curl.exe -fsS -m 15 --retry 3 -o NUL "$env:HC_URL$end"
          }
          # THE WARNINGS' OWN CHECK (18 October 2026; nightly.py, A STANDING
          # WARNING NEVER JAMS THE ALARM). A failed check of the built site
          # against the record, a reminder that fails on a date until a
          # person acts, and a part of the record that has stopped moving
          # (nightly.py, WHEN THE RECORD STOPS MOVING, 18 October 2026) are
          # WARN_FILE's, not the night's: /fail with the
          # file as the body while any stands, a plain ping when none does,
          # and nothing where --close wrote no file. With no
          # HEALTHCHECKS_WARN_URL they stay on the run's page and in the
          # verdict, and the night's check is not told of them either.
          # A night waiting for approval is among them (22 October 2026).
          $warn = 'logs/alert-warn.txt'
          if (-not $env:HC_WARN_URL) {
            Write-Output "No HEALTHCHECKS_WARN_URL secret: the warnings stay on the run's page and in the verdict."
          } elseif (Test-Path $warn) {
            if ((Get-Item $warn).Length -gt 0) {
              curl.exe -fsS -m 15 --retry 3 -o NUL --data-binary "@$warn" "$env:HC_WARN_URL/fail"
            } else {
              curl.exe -fsS -m 15 --retry 3 -o NUL "$env:HC_WARN_URL"
            }
          }
          exit 0

  # Production, and only through here. THE GATE IS ON (the person, 12 October
  # 2026: publishing automatic when every check passes, held for approval when
  # one raises a concern). A night the gate clears goes through "production",
  # which has no reviewer; a night it holds, a missing verdict, and every New
  # term run go through "production-review", where the person is the required
  # reviewer (the note above the new_term box). It deploys the very
  # build the night checked (by fingerprint), by that night's own verdict,
  # which comes down with the site; and nightly.py refuses an older night's
  # only once a newer night has built a site fit for production. A dry run,
  # or a newer night that built nothing for production, never makes a night
  # waiting here unapprovable (7 October 2026). A New term run's last step
  # here is what lets later nights keep what it accepted. A run of a branch
  # other than main is a dry run whatever its boxes say, and this job never
  # runs for one (a job's if cannot read env, so it names the ref itself).
  #
  # THE TIMER'S BOXES ARE STRINGS, AT THIS LINE (25 October 2026). The timer
  # starts the night through GitHub's API, which carries every box as a
  # string, and its first night (run 129) built a site fit for production
  # whose publish job was skipped: this line asked `inputs.dry_run == false`,
  # and "false" is not false. The run's title read the box as false, and so
  # did DRY_RUN ("false" is a string, and && returns it), so nothing else
  # noticed; nothing waited for approval, and GitHub's own run stood down for
  # the timer's. So the job asks the night for the run's DRY_RUN, which reads
  # the same whichever way the box arrives.
  publish:
    name: publish to production
    needs: night
    if: needs.night.outputs.publishable == 'true' && needs.night.outputs.dry_run == 'false' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 60
    environment:
      name: ${{ (needs.night.outputs.review == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.new_term)) && 'production' || 'production-review' }}
      url: https://graniterecord.org
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set the clock to New Hampshire's
        run: |
          tzutil /s "Eastern Standard Time"
          exit $LASTEXITCODE

      - name: Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: boto3, for cloud.py
        run: |
          python -m pip install --disable-pip-version-check --no-input boto3==1.43.103
          exit $LASTEXITCODE

      - name: Bring the state files down from R2, for whether a newer night has run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python src/ops/cloud.py state-down
          exit $LASTEXITCODE

      - name: This run's site and its night's verdict, from the private bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python src/ops/cloud.py site-down --run $env:RUN_ID
          exit $LASTEXITCODE

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python nightly.py --runner --deploy-to production
          exit $LASTEXITCODE

      # A New term run only, and only when the deploy above has landed: a
      # failed or refused deploy skips this. The files the night held back go
      # into the kit, and the counts nightly.py wrote when the deploy landed go
      # up as the census -- the kit first, so that a failure between the two
      # leaves the old counts standing against the new files, which stops the
      # next night, rather than the new counts against the old files, which
      # would not.
      - name: A published New term run's files and counts are kept for later nights
        if: env.NEW_TERM == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python src/ops/cloud.py kit-release --run $env:RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python src/ops/cloud.py state-up
          exit $LASTEXITCODE

      # THE LIVE SITE'S OWN DEAD-MAN'S SWITCH (12 October 2026), last of the
      # steps a good publish runs, because a New term run's release must
      # follow the deploy directly. The night's
      # Healthchecks check says a night ran; it cannot say the site moved. A
      # night held for approval, an approval nobody gave, a deploy refused for
      # a newer night: each leaves the live site standing still while every
      # night pings on time. This check is pinged only when production has
      # just been deployed, so it goes quiet -- and Healthchecks writes to the
      # person -- once the live site has not changed for longer than its
      # period allows. A second check, a second secret; with none, no ping.
      - name: Tell Healthchecks the live site was published
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PUBLISH_URL }}
        run: |
          if (-not $env:HC_URL) {
            Write-Output "No HEALTHCHECKS_PUBLISH_URL secret, so no ping."
            exit 0
          }
          curl.exe -fsS -m 15 --retry 3 -o NUL "$env:HC_URL"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "Healthchecks did not answer. The site is published all the same."
          }
          exit 0

      # A PUBLISH THAT FAILED IS SAID AT ONCE (15 October 2026). Without this
      # the check above only went quiet, and Healthchecks wrote once its
      # period ran out, two days later. Any step of this job failing -- the
      # site not coming down, a deploy that did not land, a fingerprint that
      # differs -- pings the same check's /fail, with the run's address as the
      # body, which Healthchecks puts in its email; the next published night
      # brings it back up. One refusal is not a failure: an older night
      # approved after a newer one, which nightly.py says in its
      # PUBLISH_QUIET file, and then this says why and pings nothing.
      - name: Tell Healthchecks the publish failed
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PUBLISH_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if (-not $env:HC_URL) {
            Write-Output "No HEALTHCHECKS_PUBLISH_URL secret, so no ping."
            exit 0
          }
          $quiet = 'logs/publish-quiet.txt'
          if (Test-Path $quiet) {
            Get-Content -Raw $quiet
            Write-Output "Not deployed on purpose, so Healthchecks is not told the publish failed."
            exit 0
          }
          New-Item -ItemType Directory -Force logs | Out-Null
          $said = 'logs/publish-failed.txt'
          "The publish job failed, so the live site was not updated: $env:RUN_URL" |
            Out-File -Encoding utf8 -NoNewline $said
          curl.exe -fsS -m 15 --retry 3 -o NUL --data-binary "@$said" "$env:HC_URL/fail"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "Healthchecks did not answer."
          }
          exit 0

  # GitHub switches a public repository's scheduled workflows off after 60
  # days without activity in it. Each scheduled night re-enables this
  # workflow through GitHub's own API, with the run's own token, which is the
  # method keepalive tools use; Healthchecks' deadline catches the first
  # missed night if it ever does not hold. It re-enables only itself, so a
  # workflow the person switched off stays off.
  keepalive:
    name: keep the schedule alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api --method PUT "repos/$REPO/actions/workflows/nightly.yml/enable" > /dev/null; then
            echo "nightly.yml re-enabled"
          else
            echo "nightly.yml could not be re-enabled"
            exit 1
          fi
