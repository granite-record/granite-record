# The nightly, on GitHub's machines: take the day's data from the General
# Court, rebuild the whole site, check it, and publish only what passes.
# reports/cloud/CLOUD_MOVE.md on the laptop is the plan this follows, and
# nightly.py's docstring says what --runner changes. preflight.py holds this
# file to its rules: only the secrets listed there, never echoed; the least
# permission each job needs; production only behind its environment.
#
# THE SCHEDULE IS ON, since 26 September 2026, after three supervised dry
# runs (the third fetched, and was clean and publishable) and the laptop's
# stand-down. To pause it, Actions -> nightly -> "..." -> Disable workflow;
# keepalive never re-enables a workflow the person switched off. To take it
# out, put the "# " back in front of the two schedule lines under "on:" and
# push to main. GitHub reads cron as UTC and has no time zone: 08:17 UTC is
# 4:17 a.m. Eastern in summer (EDT) and 3:17 a.m. in winter (EST). The :17
# keeps away from the top of the hour, when scheduled runs start late or are
# dropped. It was 06:17 until 27 September 2026, when the first scheduled
# night, at 2:17 a.m. EDT, got all 13 files under dynamicdatadump/ as 3 bytes
# (an empty file's byte-order mark), and the move to 08:17 was made on the
# guess that the General Court rewrites them around 2 a.m. The next night, at
# 4:42 a.m. EDT, got eight of them empty, so no hour is safe on the evidence:
# the files are sometimes half written in the early morning. From 28 September
# the night asked again instead -- every 30 minutes, up to six tries
# (nightly.EMPTY_TRIES). Since 2 October 2026 a scheduled night does not:
# an export that comes back empty sends it to the General Court's database
# at once (nightly.DB_AFTER_TRIES; the person's decision, because asking
# again half an hour later tended not to bring the files), and only when
# the database cannot be used is the export asked once more, half an hour
# later (nightly.TRIES_AFTER_DB). The six tries are now only a New term
# run's, started by hand, which never asks the database: it is the longest
# run there is, and is why the night's job still allows 300 minutes.
# refusal.NIGHT_WINDOWS, which keeps the laptop's fetches clear of the
# night, moves with the cron line.
#
# By hand: the Actions tab, "nightly", "Run workflow". A run by hand of main
# does what its four boxes say; a scheduled night fetches, deploys a preview,
# and asks for approval to publish. A run of any other branch ("Use workflow
# from") is a dry run whatever its boxes say, and its title says so -- "(dry
# run: not main)" where the box was unticked (the person's decision of 7
# October 2026; DRY_RUN, below). The fourth box, New term, is for the one
# night a term turns over, and the note above it says what it lets through,
# and that nothing it lets through is kept until its build is published.

name: nightly
run-name: >-
  nightly ${{ github.event_name == 'schedule' && '(scheduled)'
  || (inputs.new_term && (github.ref != 'refs/heads/main'
  && '(by hand, new term: refused, not main)'
  || ((inputs.dry_run || !inputs.fetch)
  && '(by hand, new term: refused, its page says which boxes)' || '(by hand, new term)'))
  || (inputs.dry_run && '(dry run)'
  || (github.ref != 'refs/heads/main' && '(dry run: not main)' || '(by hand, may publish)'))) }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check; nothing goes to production"
        type: boolean
        default: true
      fetch:
        description: "Take the day's data from the General Court (website and database)"
        type: boolean
        default: false
      preview:
        description: "Deploy the build to nightly.graniterecord.pages.dev (needs the Pages token)"
        type: boolean
        default: true
      # NEW TERM (30 September 2026): the night the General Court's files first
      # show a new term, when they really do get much smaller. For this run
      # only -- nightly.py --new-term -- the smaller files are installed
      # (snapshot_gencourt.py --allow-shrink), the census gates let a fall
      # through, and the feed prune is allowed. A scheduled night never carries
      # it. nightly.py refuses it with Dry run ticked, or with "Take the day's
      # data" unticked, and says so on the run's page: this is the run that
      # takes the new files and may publish the switch. The preview shows the
      # switched site before anyone approves it.
      #
      # A NEW TERM IS SEEN BY ITS YEARS (5 October 2026). A scheduled night
      # refuses files naming a newer term than the installed ones whatever
      # their size; this run takes them (--allow-turn), and only once the
      # term it leaves is frozen as installed (src/lib/freeze_term.py --session, sent
      # with seed-kit): otherwise it stops before asking anything. The census
      # lets only the feeds fall on it, and a finished term that lost bills
      # stops it as it stops any night. The
      # switch is the first night the files show the new term, Organization
      # Day's resolutions included, and a file that turns later goes in on an
      # ordinary night over its frozen copy.
      #
      # NOTHING IT ACCEPTS IS KEPT UNTIL ITS BUILD IS PUBLISHED (1 October
      # 2026). The night job of this run sends none of what it took back to the
      # kit (cloud.py kit-up --hold: it waits under nights/<run>/kit/) and
      # writes no census. The publish job, once its deploy has landed, moves
      # the files into the kit (cloud.py kit-release) and sends the new counts
      # up. Rejected, left waiting until the next scheduled night, or kept out
      # by another blocker, the run leaves the kit and the census as they were,
      # and the next night refuses the smaller files again and says why.
      #
      # THIS RUN MUST KEEP A REQUIRED REVIEWER. The person decided on 30
      # September 2026 that the switch to a new term waits for their approval
      # even after the approvals of ordinary nights are switched off. Today the
      # "production" environment has them as its required reviewer for every
      # deploy, which covers this run. Before that rule comes off, a New term
      # run's publish job must go through an environment that still has one.
      # preflight fails if this box is here without this note.
      new_term:
        description: "New term: accept the General Court's smaller files once"
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"

# The workflow's own token reads the repository and nothing else. The one job
# that needs more, keepalive, asks for it itself.
permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  WRANGLER_SEND_METRICS: "false"
  # A scheduled night fetches, previews, and may publish once approved. A run
  # by hand does what its boxes say.
  FETCH: ${{ github.event_name == 'schedule' || inputs.fetch }}
  # A DRY RUN IS KEPT APART (7 October 2026; nightly.py's docstring says why).
  # Every step inherits this, and nightly.py and cloud.py read it themselves:
  # under it the verdict goes to archive/last-dry-run.json and never to the
  # night's, the census is left alone, kit-up and state-up send back only what
  # the run fetched, and nothing goes to production -- whether or not a step
  # passes --dry-run. So a dry run on dev, started while a night waits for
  # approval, leaves that night approvable. preflight holds this line.
  # EVERY RUN OFF MAIN IS ONE (7 October 2026, the person's decision), Dry run
  # ticked or not: a run by hand on dev with the box unticked counted as a
  # real night, wrote the census, the night's verdict and the kit, so dev's
  # code reached main's next night through the bucket, and it could make a
  # waiting night unapprovable. nightly.py and cloud.py read the ref too
  # (GITHUB_REF), so an edit to this line does not reopen that. A scheduled
  # night is always main's, and it and a run by hand of main are as before.
  DRY_RUN: ${{ (github.event_name != 'schedule' && inputs.dry_run) || github.ref != 'refs/heads/main' }}
  PREVIEW: ${{ github.event_name == 'schedule' || inputs.preview }}
  # Only ever from the box, on a run by hand: never on a scheduled night.
  NEW_TERM: ${{ github.event_name == 'workflow_dispatch' && inputs.new_term }}
  # THE GATE (6 October 2026; nightly.py says what it is). "shadow": every
  # night still waits for approval in "production", and the run's page says
  # what the gate would have done. "on" goes with the publish job's
  # environment line choosing "production-review" for a night the gate holds
  # and for every New term run, and "production", with no reviewer, for the
  # rest; preflight holds the two together.
  REVIEW_GATE: shadow

defaults:
  run:
    shell: pwsh

jobs:
  night:
    name: the night
    runs-on: windows-2022
    timeout-minutes: 300
    # The preview's Pages token can live in this environment rather than in the
    # repository's secrets; see the operator checklist.
    environment:
      name: preview
      url: https://nightly.graniterecord.pages.dev
    # One night at a time, and never beside the weekly job: a second start
    # waits for the first rather than running beside it.
    concurrency:
      group: gc-night
      cancel-in-progress: false
    outputs:
      built: ${{ steps.night.outputs.built }}
      publishable: ${{ steps.night.outputs.publishable }}
      # THE GATE (6 October 2026; nightly.py says what it is): "false" when the
      # night would publish without approval, "true" when it would wait for
      # it. In shadow nothing reads it yet: every night still waits in
      # "production". The routing that reads it is a person's change to make.
      review: ${{ steps.night.outputs.review }}
    steps:
      # HEALTHCHECKS HEARS ONLY FROM A REAL RUN (7 October 2026). Its check is
      # the dead-man's switch for a night that never ran: a scheduled night,
      # or a run by hand of main that is not a dry run, pings it. A dry run --
      # by the box, or by its branch -- pings nothing, at the start or the
      # end: its success on a day the scheduled night failed to start would
      # stand in for that night and hide it. preflight holds both steps.
      - name: Tell Healthchecks the night has started
        if: env.DRY_RUN == 'false'
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if (-not $env:HC_URL) {
            Write-Output "No HEALTHCHECKS_URL secret, so no ping."
            exit 0
          }
          curl.exe -fsS -m 15 --retry 3 -o NUL "$env:HC_URL/start"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "Healthchecks did not answer. The night goes on without it."
          }
          exit 0

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set the clock to New Hampshire's
        run: |
          tzutil /s "Eastern Standard Time"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Date -Format "yyyy-MM-dd HH:mm zzz"

      - name: Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      # boto3 is cloud.py's, for R2: any version from 1.36 fits the checksum
      # setting it makes, and this one is pinned so a night does not take
      # whatever is newest. yt-dlp is the livestream step's, for captions, at
      # the laptop's version; without it that step exits 3, "not set up".
      - name: The Python packages, at the laptop's versions, with boto3 and yt-dlp
        run: |
          python -m pip install --disable-pip-version-check --no-input `
            numpy==2.5.2 openpyxl==3.1.5 et-xmlfile==2.0.0 pdfplumber==0.11.10 `
            pdfminer.six==20260107 pypdfium2==5.13.0 pillow==12.3.0 `
            charset-normalizer==3.5.1 cryptography==50.0.1 cffi==2.1.1 pycparser==3.0 `
            PyYAML==6.0.3 boto3==1.43.103 yt-dlp==2026.8.19
          exit $LASTEXITCODE

      - name: Bring the state files down from R2 (the refusal record, last night's census)
        id: statedown
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py state-down
          exit $LASTEXITCODE

      - name: Bring the kit down from R2
        id: kitdown
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py kit-down
          exit $LASTEXITCODE

      # YouTube, not the General Court. Before the build, which reads what it
      # adds; its --markers step runs inside build_all, after the step
      # --no-captions skips. Exit 0 is success, including "nothing new" and
      # "captions deferred" (YouTube's bot check). Any other exit -- 3 is "not
      # set up": no key, a refused key, or no yt-dlp -- fails the night, loudly,
      # at --close, without stopping the day's General Court files from being
      # taken and built: those cannot be taken later.
      - name: New livestreams, from YouTube
        id: livestreams
        if: env.FETCH == 'true'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if (-not (Test-Path livestreams.py)) {
            Write-Output "livestreams.py is not in this commit yet, so this step does nothing."
            exit 0
          }
          python livestreams.py --since-state
          $rc = $LASTEXITCODE
          if ($rc -eq 3) {
            Write-Output "livestreams.py exit 3: not set up. The night goes on, and fails at its end."
          }
          exit $rc

      # A NIGHT THE EXPORT FAILS (1 October 2026). When the General Court's
      # daily files come back empty, the night asks the SQL host the General
      # Court publishes credentials for instead (fetch_day_db.py, then
      # dayfiles_from_db.py) and installs all seven changing files or none --
      # since 2 October at once, after the export's first try, and no longer
      # after its sixth; nightly.py's docstring says when it may, and when
      # the export is asked once more afterwards. It needs nothing new
      # from this workflow, and NO SECRET: the credentials are the published
      # ones in probe_db.py; PowerShell, which reaches that host, is on this
      # image, as the study committees' views already use it; the hold on
      # that host (archive/sql-held.json) comes down and goes back with the
      # state files; and the copy kept under nh-archive/from-db/ goes back
      # with the kit. A scheduled night waits half an hour at most, and
      # only when the database cannot be used and the export is asked a
      # second time. The longest run is a New term run by hand: its six
      # tries are two and a half hours of the job's five, and the build is
      # under thirty minutes.
      - name: The night
        id: night
        run: |
          $flags = @('--runner')
          if ($env:FETCH -ne 'true') { $flags += '--no-fetch' }
          if ($env:DRY_RUN -eq 'true') { $flags += '--dry-run' }
          if ($env:NEW_TERM -eq 'true') { $flags += '--new-term' }
          python nightly.py @flags
          exit $LASTEXITCODE

      # A refusal is a fact about the address, and the laptop has to know at
      # once, not when the rest of the night has finished.
      - name: A refusal goes to R2 at once
        if: always() && steps.statedown.outcome == 'success' && hashFiles('archive/refused.json') != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          Write-Output "A refusal is on file in archive/refused.json. It goes to R2's state/ now."
          python cloud.py state-up
          exit $LASTEXITCODE

      - name: Deploy to the preview address
        id: preview
        if: always() && steps.night.outputs.built == 'true' && env.PREVIEW == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python nightly.py --runner --deploy-to preview
          exit $LASTEXITCODE

      # The publish job runs on another machine and needs this night's site.
      # Not as a GitHub artifact: a public repository's artifacts can be
      # downloaded by anyone signed in to GitHub, and the built site carries
      # the licensed logo. It goes to the private bucket as one archive,
      # nights/<run>/site.tar.gz, which the bucket's lifecycle rule deletes
      # after three days; its night's own verdict goes with it, in site.json,
      # and is what the publish job deploys it by.
      - name: Send the site to the private bucket for the publish job
        id: pack
        if: success() && steps.night.outputs.publishable == 'true' && env.DRY_RUN == 'false'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python cloud.py site-up --run $env:RUN_ID
          exit $LASTEXITCODE

      # On a New term run what the night changed is HELD: it waits under
      # nights/<run>/kit/ and kit/ keeps the copies it had, so that the next
      # night still meets the smaller files and refuses them until this run's
      # build is published. The logs, the day's archive copy and the state go
      # up as on any night. On a dry run (DRY_RUN, above, which cloud.py reads
      # itself) only what the run fetched goes back -- the day's files as the
      # export served them and their archive -- with its logs under
      # logs/<day>/dry-run/, a refusal or a hold, and its own verdict: nothing
      # its branch's code made, which main's next night would build from
      # (cloud.py's docstring, --dry-night). Both state-up steps likewise.
      - name: Send what changed, and the logs, back to R2
        id: kitup
        if: always() && steps.kitdown.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $hold = @()
          if ($env:NEW_TERM -eq 'true') { $hold = @('--hold', $env:RUN_ID) }
          python cloud.py kit-up @hold
          exit $LASTEXITCODE

      - name: The night's verdict
        if: always()
        run: |
          python nightly.py --runner --close `
            --outcome "state-down=${{ steps.statedown.outcome }}" `
            --outcome "kit-down=${{ steps.kitdown.outcome }}" `
            --outcome "livestreams=${{ steps.livestreams.outcome }}" `
            --outcome "night=${{ steps.night.outcome }}" `
            --outcome "preview=${{ steps.preview.outcome }}" `
            --outcome "pack=${{ steps.pack.outcome }}" `
            --outcome "kit-up=${{ steps.kitup.outcome }}"
          exit $LASTEXITCODE

      - name: Send the state files back to R2
        if: always() && steps.statedown.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py state-up
          exit $LASTEXITCODE

      # Never for a dry run (the note above the first step).
      - name: Tell Healthchecks how the night ended
        if: always() && env.DRY_RUN == 'false'
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL }}
          ENDED: ${{ job.status }}
        run: |
          if (-not $env:HC_URL) {
            Write-Output "No HEALTHCHECKS_URL secret, so no ping."
            exit 0
          }
          $end = if ($env:ENDED -eq 'success') { '' } else { '/fail' }
          curl.exe -fsS -m 15 --retry 3 -o NUL "$env:HC_URL$end"
          exit 0

  # Production, and only through here. The "production" environment has the
  # person as its required reviewer until five clean nights have passed, so
  # this job waits for their approval; removing that rule is what makes
  # publishing automatic -- except for a New term run, which must keep a
  # required reviewer (the note above the new_term box). It deploys the very
  # build the night checked (by fingerprint), by that night's own verdict,
  # which comes down with the site; and nightly.py refuses an older night's
  # only once a newer night has built a site fit for production. A dry run,
  # or a newer night that built nothing for production, never makes a night
  # waiting here unapprovable (7 October 2026). A New term run's last step
  # here is what lets later nights keep what it accepted. A run of a branch
  # other than main is a dry run whatever its boxes say, and this job never
  # runs for one (a job's if cannot read env, so it names the ref itself).
  publish:
    name: publish to production
    needs: night
    if: needs.night.outputs.publishable == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: windows-2022
    timeout-minutes: 60
    environment:
      name: production
      url: https://graniterecord.org
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set the clock to New Hampshire's
        run: |
          tzutil /s "Eastern Standard Time"
          exit $LASTEXITCODE

      - name: Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: boto3, for cloud.py
        run: |
          python -m pip install --disable-pip-version-check --no-input boto3==1.43.103
          exit $LASTEXITCODE

      - name: Bring the state files down from R2, for whether a newer night has run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python cloud.py state-down
          exit $LASTEXITCODE

      - name: This run's site and its night's verdict, from the private bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python cloud.py site-down --run $env:RUN_ID
          exit $LASTEXITCODE

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python nightly.py --runner --deploy-to production
          exit $LASTEXITCODE

      # A New term run only, and only when the deploy above has landed: a
      # failed or refused deploy skips this. The files the night held back go
      # into the kit, and the counts nightly.py wrote when the deploy landed go
      # up as the census -- the kit first, so that a failure between the two
      # leaves the old counts standing against the new files, which stops the
      # next night, rather than the new counts against the old files, which
      # would not.
      - name: A published New term run's files and counts are kept for later nights
        if: env.NEW_TERM == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python cloud.py kit-release --run $env:RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python cloud.py state-up
          exit $LASTEXITCODE

  # GitHub switches a public repository's scheduled workflows off after 60
  # days without activity in it. Each scheduled night re-enables this
  # workflow through GitHub's own API, with the run's own token, which is the
  # method keepalive tools use; Healthchecks' deadline catches the first
  # missed night if it ever does not hold. It re-enables only itself, so a
  # workflow the person switched off stays off.
  keepalive:
    name: keep the schedule alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api --method PUT "repos/$REPO/actions/workflows/nightly.yml/enable" > /dev/null; then
            echo "nightly.yml re-enabled"
          else
            echo "nightly.yml could not be re-enabled"
            exit 1
          fi
