# The email sender: a Worker of its own, deployed by a person, never by
# `publish` or the nightly:
#
#   npx wrangler deploy --config workers/follow/wrangler.toml                  (production)
#   npx wrangler deploy --config workers/follow/wrangler.toml --env preview    (previews)
#
# Production has no address: it runs on the cron below and answers no
# request. It reads the follow database and the site's published /changes/
# files, and sends through Resend.
#
# THE PREVIEW HAS ONE (23 October 2026): its workers.dev address answers
# POST /test-send, which sends the person test emails on request and records
# nothing (sender.js, A TEST SEND; README.md, "Sending yourself a test
# email"). Only behind both of its guards: TEST_SEND = "on", which
# [env.preview.vars] alone sets, and the secret TEST_SEND_TOKEN, which only
# the preview Worker is given. Production keeps workers_dev = false, no
# route and no TEST_SEND; preflight's _follow_test_send holds all three.
#
# NO SECRET IS IN THIS FILE. Three are set on Cloudflare by the person with
# `wrangler secret put` (README.md says how): RESEND_API_KEY, and
# FOLLOW_ADDRESS_KEY, the same address key the Pages project holds. The
# sender never looks an address up, so it is not given the lookup key. And
# HEALTHCHECK_URL, the ping address of a Healthchecks check of its own
# (hourly period): each run pings it, /fail when it met a problem a person
# must act on (sender.js, WHO IS TOLD WHEN IT BREAKS). Without it, no ping.
# On the preview Worker alone, a fourth: TEST_SEND_TOKEN, the test send's
# second guard. Without it, /test-send is a 404 there too.
#
# THE DATABASE IDS are the person's, from the output of
# `npx wrangler d1 create graniterecord-follow` (and -preview). An id is not a
# secret -- it names a database, and using one needs this account's
# credentials. Both were created, and given schema.sql, by the person on
# 11 October 2026.

name = "graniterecord-follow-sender"
main = "sender.js"
compatibility_date = "2026-09-04"
workers_dev = false

# Every hour, on the hour, UTC. Cron has no time zone and New Hampshire moves
# between UTC-4 and UTC-5, so the sender asks New Hampshire's clock itself and
# sends from the first run at or after 8:00 there: 12:00 UTC in summer, 13:00
# in winter, and on Saturdays the weekly too. Every run purges unconfirmed
# requests older than 48 hours.
[triggers]
crons = ["0 * * * *"]

# Workers Logs, so a run's codes and counts (common.note) can be read after
# the fact in the dashboard rather than only live through `wrangler tail`.
[observability]
enabled = true

[[d1_databases]]
binding = "FOLLOW_DB"
database_name = "graniterecord-follow"
database_id = "c43becf3-b914-4d17-8548-4f066af4544a"   # created by the person, 11 October 2026

[vars]
# Where the changes files are read from, and the origin of every link in an
# email. The site's own name, and nothing else.
SITE_ORIGIN = "https://graniterecord.org"
# The sending address on the domain verified with Resend, as
# "Granite Record <name@your-verified-domain>". Left empty, nothing is sent
# and the log says "follow sender.error.ConfigError".
MAIL_FROM = "Granite Record <noreply@mail.graniterecord.org>"
# The feedback form linked in the footer of every page of the site.
FEEDBACK_URL = "https://forms.gle/PYw9c3xgpDDwvX7E9"
# A run is one Worker invocation, and two limits bound it; the sender stops
# taking readers before it would pass either, and the next hour's run carries
# on. The account is on Workers Paid (the person, 11 October 2026); the
# figures below are that plan's as remembered -- check Cloudflare's limits
# pages on the day (README.md) -- with room left under each.
#
# SEND_LIMIT: emails a run. Every email is a request out of the Worker (Paid
# allows a thousand, Free fifty), and the sender also reads up to nine
# changes files.
SEND_LIMIT = "200"
# D1_QUERIES_PER_RUN: database statements a run, counted one by one, a
# batch's included (D1 allows a thousand an invocation on Paid, fifty on
# Free). A reader costs at most five, so a run serves about 180 readers.
# Resend is on Pro since 15 October 2026: 50,000 emails a month, no daily
# cap. SEND_LIMIT (200) and the twelve runs from 8:00 to 20:00 serve about
# 2,400 readers a day; the tighter ceiling is Pro's month, about 1,650 emails
# a day with the confirmations, before the cron goes every quarter hour or
# the sends go through Resend's batch endpoint.
D1_QUERIES_PER_RUN = "900"
# Milliseconds between emails: at most five a second, half the team's
# limit, which Resend's dashboard shows as 10 requests a second on Pro (the
# person, 22 October 2026), so the confirmations the site sends meanwhile
# have the other half. A 429 is waited out once (mail.js) and then stops
# the run.
SEND_GAP_MS = "200"

[env.preview]
name = "graniterecord-follow-sender-preview"
# The address the test send is asked at, which `wrangler deploy --env preview`
# prints: https://graniterecord-follow-sender-preview.<subdomain>.workers.dev
workers_dev = true

[env.preview.observability]
enabled = true

[env.preview.triggers]
crons = ["0 * * * *"]

[[env.preview.d1_databases]]
binding = "FOLLOW_DB"
database_name = "graniterecord-follow-preview"
database_id = "296ea738-2f5f-4ec6-8951-6496282c35c3"   # created by the person, 11 October 2026

[env.preview.vars]
# The preview deployment's own address, the branch alias Pages gives it.
SITE_ORIGIN = "https://dry-run.graniterecord.pages.dev"
MAIL_FROM = "Granite Record <noreply@mail.graniterecord.org>"
FEEDBACK_URL = "https://forms.gle/PYw9c3xgpDDwvX7E9"
SEND_LIMIT = "200"
D1_QUERIES_PER_RUN = "900"
SEND_GAP_MS = "200"
# The test send's first guard (sender.js, A TEST SEND). Here and nowhere
# else: never in [vars] above, which is production's.
TEST_SEND = "on"
