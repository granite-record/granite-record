# GRANITE_VERSION: 2026-09-12.7
#
# The Pages project's configuration, which this file now owns. Until
# 12 September there was none: the dashboard held a name and a compatibility
# date and nothing else (wrangler pages download config), so adopting a file
# loses no setting. From the first deploy that carries it, THIS FILE is the
# source of truth and the dashboard shows these fields read-only.
#
# It exists for the report box (functions/api/report.js): the database it
# writes to, and the addresses it accepts reports from. Production and preview
# each name their own database explicitly, rather than trusting a top-level
# binding to reach previews -- the documentation says top-level applies "to
# local and production" -- so a test report sent to a preview deployment never
# lands among real readers' reports. Bindings and vars are "non-inheritable":
# each environment states all of its own.
#
# The ids are not secrets. They name a database; using one needs this
# account's credentials. A fork creates its own and replaces them.

name = "graniterecord"
pages_build_output_dir = "site"
compatibility_date = "2026-09-04"

# Top level: what `wrangler pages dev` uses locally, against a local copy.
[[d1_databases]]
binding = "DB"
database_name = "graniterecord-reports"
database_id = "1fb4afb6-62dc-455a-9357-0125bcf7577a"

# LIVE NOW AND THE LIVE VOTES FILE (the person, 26 October 2026: the live
# layer, its defaults): functions/api/live/ read the live Worker's private
# bucket through _store.js's get and head alone. Locally a bucket of its own
# name; production and PREVIEWS both the real one, accepted explicitly (design
# 6.4, default 4): a preview can show the real day's live data, and the
# read-only facade, held by preflight, is why that is safe. Lands only once
# the person has created the bucket graniterecord-live.
[[r2_buckets]]
binding = "LIVE"
bucket_name = "graniterecord-live-local"

[vars]
REPORT_ORIGINS = "localhost:8788 localhost:8790 127.0.0.1:8788 127.0.0.1:8790"

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "graniterecord-reports"
database_id = "1fb4afb6-62dc-455a-9357-0125bcf7577a"

# EMAIL FOLLOWING ON THE LIVE SITE (the person, 23 October 2026: "Email
# following should be enabled on the live site prior to the webinar"). The
# Functions under functions/api/follow/ answer only where FOLLOW_DB is bound;
# the sender (workers/follow/) mails nobody while they do not. Created by the
# person, 11 October 2026; the same id as workers/follow/wrangler.toml's.
[[env.production.d1_databases]]
binding = "FOLLOW_DB"
database_name = "graniterecord-follow"
database_id = "c43becf3-b914-4d17-8548-4f066af4544a"

# THE SHARED BENCH ON THE LIVE SITE (the person, 17 November 2026: "Yes, both
# tonight"). functions/bench.js and functions/api/bench/ answer only where
# BENCH_DB is bound, and only to a link's token; without it every route is a
# 404 of its own. Its own database, created 17 November 2026 at the person's
# word, with workers/bench/schema.sql; preflight's _bench_switch holds the name.
[[env.production.d1_databases]]
binding = "BENCH_DB"
database_name = "graniterecord-bench"
database_id = "178d59e2-2866-44ba-ac3d-4afc10ccc0d3"

[[env.production.r2_buckets]]
binding = "LIVE"
bucket_name = "graniterecord-live"

# The site's names only. Every production deployment also answers at its own
# <hash>.graniterecord.pages.dev address for good, and those are not the site.
[env.production.vars]
REPORT_ORIGINS = "graniterecord.org www.graniterecord.org"
# Email following's, set ahead of the go-live (22 October 2026): with
# FOLLOW_DB bound and no MAIL_FROM, every sign-up was told "on its way" and
# sent nothing. Harmless until then: every follow endpoint answers 404
# without the database. preflight holds both here.
MAIL_FROM = "Granite Record <noreply@mail.graniterecord.org>"
FEEDBACK_URL = "https://forms.gle/PYw9c3xgpDDwvX7E9"

[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "graniterecord-reports-preview"
database_id = "39c58ee3-73cd-41a5-b998-b259bcf1d902"

# EMAIL FOLLOWING ON PREVIEWS, on a database of their own
# (workers/follow/README.md). With FOLLOW_DB bound, functions/api/follow/
# answers; without it every one of them answers 404. Production binds its own
# since 23 October 2026 (above). The database is the person's, created 11
# October 2026, and its secrets are set on Cloudflare, never here.
[[env.preview.d1_databases]]
binding = "FOLLOW_DB"
database_name = "graniterecord-follow-preview"
database_id = "296ea738-2f5f-4ec6-8951-6496282c35c3"

# THE SHARED BENCH ON PREVIEWS, on a database of its own (created 17 November
# 2026 with the live site's), so a link tried on a preview never reaches the
# live bench's judgments.
[[env.preview.d1_databases]]
binding = "BENCH_DB"
database_name = "graniterecord-bench-preview"
database_id = "5ec89146-4786-4146-b857-76be9086c1d3"

[[env.preview.r2_buckets]]
binding = "LIVE"
bucket_name = "graniterecord-live"

[env.preview.vars]
REPORT_ORIGINS = "*.graniterecord.pages.dev"
MAIL_FROM = "Granite Record <noreply@mail.graniterecord.org>"
FEEDBACK_URL = "https://forms.gle/PYw9c3xgpDDwvX7E9"
