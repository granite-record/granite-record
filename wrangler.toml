# GRANITE_VERSION: 2026-09-12.4
#
# The Pages project's configuration, which this file now owns. Until
# 12 September there was none: the dashboard held a name and a compatibility
# date and nothing else (wrangler pages download config), so adopting a file
# loses no setting. From the first deploy that carries it, THIS FILE is the
# source of truth and the dashboard shows these fields read-only.
#
# It exists for the report box (functions/api/report.js): the database it
# writes to, and the addresses it accepts reports from. Production and preview
# each name their own database explicitly, rather than trusting a top-level
# binding to reach previews -- the documentation says top-level applies "to
# local and production" -- so a test report sent to a preview deployment never
# lands among real readers' reports. Bindings and vars are "non-inheritable":
# each environment states all of its own.
#
# The ids are not secrets. They name a database; using one needs this
# account's credentials. A fork creates its own and replaces them.

name = "graniterecord"
pages_build_output_dir = "site"
compatibility_date = "2026-09-04"

# Top level: what `wrangler pages dev` uses locally, against a local copy.
[[d1_databases]]
binding = "DB"
database_name = "graniterecord-reports"
database_id = "1fb4afb6-62dc-455a-9357-0125bcf7577a"

[vars]
REPORT_ORIGINS = "localhost:8788 localhost:8790 127.0.0.1:8788 127.0.0.1:8790"

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "graniterecord-reports"
database_id = "1fb4afb6-62dc-455a-9357-0125bcf7577a"

# The site's names only. Every production deployment also answers at its own
# <hash>.graniterecord.pages.dev address for good, and those are not the site.
[env.production.vars]
REPORT_ORIGINS = "graniterecord.org www.graniterecord.org"
MAIL_FROM = "Granite Record <noreply@mail.graniterecord.org>"
FEEDBACK_URL = "https://forms.gle/PYw9c3xgpDDwvX7E9"

# EMAIL FOLLOWING, LIVE (the person, 12 October 2026: production's secrets
# set, the Resend webhook and the Turnstile hostnames in place). With this
# binding functions/api/follow/ answers on the site, and shell.follow_live()
# reads it, so About and the Data page say what following keeps in the
# person's approved words. The database is the person's, created 11 October
# 2026; its secrets are on Cloudflare, never here.
[[env.production.d1_databases]]
binding = "FOLLOW_DB"
database_name = "graniterecord-follow"
database_id = "c43becf3-b914-4d17-8548-4f066af4544a"

[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "graniterecord-reports-preview"
database_id = "39c58ee3-73cd-41a5-b998-b259bcf1d902"

# EMAIL FOLLOWING ON PREVIEWS (workers/follow/README.md), on a database of
# its own so a test sign-up never reaches the live list. With FOLLOW_DB
# bound, functions/api/follow/ answers; without it every one of them answers
# 404. The database is the person's, created 11 October 2026, and its
# secrets are set on Cloudflare, never here.
[[env.preview.d1_databases]]
binding = "FOLLOW_DB"
database_name = "graniterecord-follow-preview"
database_id = "296ea738-2f5f-4ec6-8951-6496282c35c3"

[env.preview.vars]
REPORT_ORIGINS = "*.graniterecord.pages.dev"
MAIL_FROM = "Granite Record <noreply@mail.graniterecord.org>"
FEEDBACK_URL = "https://forms.gle/PYw9c3xgpDDwvX7E9"
