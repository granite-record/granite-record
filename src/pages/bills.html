<!DOCTYPE html>
<!-- GRANITE_VERSION: 2026-09-05.74 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Search every bill of the New Hampshire General Court by number, subject, sponsor or committee, with its votes, hearings and full history."><link rel="canonical" href="https://graniterecord.org/bills.html"><meta property="og:type" content="website"><meta property="og:title" content="New Hampshire bills | Granite Record"><meta property="og:description" content="Search every bill of the New Hampshire General Court by number, subject, sponsor or committee."><meta property="og:url" content="https://graniterecord.org/bills.html"><meta property="og:site_name" content="Granite Record"><meta name="twitter:card" content="summary_large_image">
<!-- Opening a bill pushes /bill/2026/hb1123, which re-bases every
     relative link on this page unless this is here. The record pages
     have carried it since they were folders down; this one is at the
     root and did not need it until the address changed. -->
<base href="/">
<title>Granite Record — New Hampshire legislative history</title>
<!-- The head's shared lines, the header, the footer and the closing scripts
     are chrome.py's, written into these CHROME slots (chrome.fill). -->
<!-- CHROME:head -->
</head>
<body>
<a class="skip" href="/bills.html#results">Skip to the bills</a>
<!-- Every landmark has a name: this nav, the search row and the filters. -->
<!-- CHROME:nav -->
<div class="searchrow" role="search" aria-label="Search bills"><div class="in">
<div class="qline">
  <label for="year" style="position:absolute;left:-9999px">Legislative term</label>
  <select id="year" title="Two-year term"></select>
  <label for="q" style="position:absolute;left:-9999px">Search bills</label>
  <div class="qbox">
    <input id="q" type="search" spellcheck="false" autocomplete="off" disabled
     placeholder="Bill number or key words">
    <button id="qgo" type="button" disabled title="Search"
     aria-label="Search">&#8629;</button>
  </div>
</div>
<div class="qhint"><!-- THE SORT COMES FIRST, under the term picker and as wide as it
     (the person, 8 October 2026: "The best match/sort by should be to the
     left of the number of matching bills ... and the width of the dropdown
     boxes for the term selector and sort by should be the same size"). It
     sat after the count, so the count arriving with the first letter typed
     pushed it along the row; at the start of the row nothing before it can
     move it.
     role=status AND aria-live: a screen reader was never told the result
     set had changed. Typing a search, ticking a facet or switching term
     redraws the list silently, so a reader who cannot see it had no way
     to know whether anything happened. The count carries the one sentence
     worth hearing -- "2,243 bills in the 2025-2026 term", "31 of 2,243
     bills in the 2025-2026 term", or "loading 2023-2024" while a term
     arrives -- and since the same evening it is never empty under a list:
     with nothing narrowing it, it says the term's whole count. aria-atomic
     because the whole sentence is replaced at once and half of it read
     aloud would be worse than none. -->
<label for="sort" style="position:absolute;left:-9999px">Sort order</label>
<select id="sort">
  <option value="best">Best match</option>
  <option value="num" selected>Bill number</option>
  <option value="recent">Most recent action</option>
  <option value="status">Status</option>
</select>
<span id="count" role="status" aria-live="polite" aria-atomic="true">Loading…</span>
<span id="synhint"></span></div>
</div></div>
<div class="shell"><button class="ftoggle" id="ftoggle" type="button"
 aria-expanded="false" aria-controls="facets" hidden><span>Filter by topic,
 sponsor or committee</span><span class="badge" hidden></span><span
 class="chev">&#9656;</span></button>
<aside class="facets" id="facets" aria-label="Filters"></aside>
<main id="main"><h1 class="sr">New Hampshire bills</h1>
<p class="count" id="summary"></p><div id="results"></div></main></div>

<!-- CHROME:footer -->
<script src="app.js"></script>
<!-- CHROME:scripts -->
</body>
</html>
